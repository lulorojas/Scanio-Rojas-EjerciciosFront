<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio B - Tarjeta de Usuario</title>
    <link rel="stylesheet" href="css2ejerciciob.css">
</head>
<body>

    <div class="card">
        <!-- Banner con avatar -->
        <div class="banner">
            <div class="avatar-wrapper">
                <img
                    src="https://i.pravatar.cc/150?img=47"
                    alt="Foto de perfil de María García"
                >
            </div>
        </div>

        <!-- Datos del perfil -->
        <div class="card-body">
            <h2>María García</h2>
            <p class="city">Buenos Aires, Argentina</p>

            <!-- Estadísticas -->
            <div class="stats">
                <div class="stat">
                    <span class="stat-number">1.2K</span>
                    <span class="stat-label">Seguidores</span>
                </div>
                <div class="stat">
                    <span class="stat-number">348</span>
                    <span class="stat-label">Likes</span>
                </div>
                <div class="stat">
                    <span class="stat-number">87</span>
                    <span class="stat-label">Fotos</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
