<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garage</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    
<header class="header"> 

<div class="div-logo">
    <img src="imagenes/logo.png" alt="logo" class="logo">
</div>

<nav class="navbar">
    <ul class="nav-links">
        <li><a href="#inicio">Inicio</a></li>
        <li><a href="#catalogo">Catalogo</a></li>
        <li><a href="#contacto">Contacto</a></li>
    </ul>
</nav>

        <img src="imagenes/hamburguesa.png" alt="" class="hamburguesa-img">


</header>

<main class="principal">
        
    <section class="seccion-catalogo" id="catalogo">
        <h2 class="titulo-seccion">Nuestro Catálogo</h2>
        
        <div class="contenedor-tarjetas">
            
            <div class="tarjeta">
                <img src="corsa.jpg" alt="Chevrolet Corsa" class="imagen-auto">
                <div class="info-auto">
                    <h3>Chevrolet Corsa Classic</h3>
                    <p>Año: 2010 | Motor: 1.4L</p>
                    <button class="boton-detalles">Ver detalles</button>
                </div>
            </div>

            <div class="tarjeta">
                <img src="gol.jpg" alt="VW Gol Power" class="imagen-auto">
                <div class="info-auto">
                    <h3>VW Gol Power</h3>
                    <p>Año: 2012 | Motor: 1.6L</p>
                    <button class="boton-detalles">Ver detalles</button>
                </div>
            </div>

            <div class="tarjeta">
                <img src="golf.jpg" alt="VW Golf GTI" class="imagen-auto">
                <div class="info-auto">
                    <h3>VW Golf GTI</h3>
                    <p>Año: 2018 | Motor: 2.0L Turbo</p>
                    <button class="boton-detalles">Ver detalles</button>
                </div>
            </div>

        </div>
    </section>

</main>

<footer>

</footer>

</body>
</html>
