    <!--esto lo hice con ia para que cada vez que tqoque el boton detalles me muestre la info del auto que toque, lo hice con un objeto que tiene toda la info de cada auto y con js busco el id del auto que toque y lo muestro en el html --> 
<script>
    let datos = {
        "corsa": {
            img: "imagenes/autos/corsa.jpg",
            titulo: "Chevrolet Corsa Classic",
            dueño: "Dueño: Esca",
            desc: "El corsa, que decir del corsa. Fue el primero, el que tan feliz nos hizo, el que tantas veces nos llevo. Sin duda el que mas aura tiene, el mas rapido, simplemente el pinguino.",
            mods: "<li>Año: 2004</li><li>Motor: 1.6L 8v</li><li>Escape: Medio silens</li><li>Suspension: Trabajada a medida</li>"
        },
        "fox": {
            img: "imagenes/autos/fox.jpg",
            titulo: "VW Fox",
            dueño: "Dueño: Lolo",
            desc: "El zorrito de Lolo, chiquito, comodo, fachero y rapido, una bala.",
            mods: "<li>Año: 2010</li><li>Motor: 1.6L 16v</li><li>Escape: Original</li>"
        },
        "peugeot206": {
            img: "imagenes/autos/206.jpg",
            titulo: "Peugeot 206",
            dueño: "Dueño: Tato",
            desc: "El tan esperado 206 de luca, con motor chancho abajo pero en altas revoluciones vuela.",
            mods: "<li>Año: 2004</li><li>Motor: 1.6L 16v</li><li>Suspensión: Trabajada</li>"
        },
        "peugeot208": {
            img: "imagenes/autos/208.jpeg",
            titulo: "Peugeot 208",
            dueño: "Dueño: Nico",
            desc: "El heredado de nico, el mas fachero (aunque no tiene mucha aura porque es heredado).",

        },
        "etios": {
            img: "imagenes/autos/etios.webp",
            titulo: "Toyota Etios",
            dueño: "Dueño: Santi",
            desc: "El Etios no se rompe mas. El ideal para ir de a 8 en un auto. Bien lanchita.",
            mods: "<li>Año: 2021</li><li>Motor: 1.5L 16v</li><li>Estado: Joya nunca taxi</li>"
        }
    };

    let parametros = new URLSearchParams(window.location.search);
    let idAuto = parametros.get("id");

    if (datos[idAuto]) {
        document.getElementById("foto").src = datos[idAuto].img;
        document.getElementById("titulo").innerText = datos[idAuto].titulo;
        document.getElementById("dueño").innerText = datos[idAuto].dueño;
        document.getElementById("descripcion").innerText = datos[idAuto].desc;
        document.getElementById("lista").innerHTML = datos[idAuto].mods;
    }
</script>
